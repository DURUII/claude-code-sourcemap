services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus scrape endpoint for converted OTEL metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-otlp-receiver"
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP query/status
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.4}
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.4}
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_BASE_URL:-http://localhost:5601}
    depends_on:
      elasticsearch:
        condition: service_healthy

  elastic-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.4}
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -eu
        curl -fsS -X PUT http://elasticsearch:9200/_ilm/policy/claude-code-7d-delete \
          -H 'Content-Type: application/json' \
          -d '{"policy":{"phases":{"delete":{"min_age":"7d","actions":{"delete":{}}}}}}'
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/claude-code-logs \
          -H 'Content-Type: application/json' \
          -d '{"index_patterns":["claude-code-logs*"],"template":{"settings":{"index.lifecycle.name":"claude-code-7d-delete"}}}'
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/claude-code-traces \
          -H 'Content-Type: application/json' \
          -d '{"index_patterns":["claude-code-traces*"],"template":{"settings":{"index.lifecycle.name":"claude-code-7d-delete"}}}'
        for index in claude-code-logs claude-code-traces; do
          curl -fsS -o /dev/null -X PUT "http://elasticsearch:9200/$$index" \
            -H 'Content-Type: application/json' \
            -d '{"settings":{"index.lifecycle.name":"claude-code-7d-delete"}}' || true
          curl -fsS -o /dev/null -X PUT "http://elasticsearch:9200/$$index/_settings" \
            -H 'Content-Type: application/json' \
            -d '{"index.lifecycle.name":"claude-code-7d-delete"}' || true
        done

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-growthbook}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-growthbook}
    volumes:
      - mongo-data:/data/db

  growthbook:
    image: growthbook/growthbook:latest
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        grep -rl "max-age=3600" /usr/local/src/app/packages/front-end/.next/server 2>/dev/null \
          | while IFS= read -r file; do
              sed -i 's/max-age=3600/no-cache, no-store, must-revalidate/g' "$$file"
            done
        exec node_modules/.bin/pm2-runtime start ecosystem.config.js
    ports:
      - "3000:3000"   # GrowthBook app
      - "3100:3100"   # GrowthBook API
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-growthbook}:${MONGO_INITDB_ROOT_PASSWORD:-growthbook}@mongo:27017/growthbook?authSource=admin
      APP_ORIGIN: ${GROWTHBOOK_APP_ORIGIN:-http://localhost:3000}
      API_HOST: ${GROWTHBOOK_API_HOST:-http://localhost:3100}
      JWT_SECRET: ${GROWTHBOOK_JWT_SECRET:-dev-jwt-secret-change-me}
      ENCRYPTION_KEY: ${GROWTHBOOK_ENCRYPTION_KEY:-dev-encryption-key-change-me}
    depends_on:
      - mongo
    volumes:
      - growthbook-uploads:/usr/local/src/app/packages/back-end/uploads

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  elasticsearch-data:
  grafana-data:
  mongo-data:
  growthbook-uploads:
