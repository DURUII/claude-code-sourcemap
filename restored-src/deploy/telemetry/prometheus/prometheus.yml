global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: claude-code-otel
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
