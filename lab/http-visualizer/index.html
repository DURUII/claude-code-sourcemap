<!doctype html>
<html lang="en" class="vscode-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code Scope</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="app-chrome">
          <nav class="session-tabs" id="session-tabs"></nav>
          <div class="app-actions">
            <button id="export-events" class="icon-button" type="button" aria-label="Export events" title="Export events">↓</button>
            <button id="clear-events" class="icon-button" type="button" aria-label="Clear events" title="Clear events">×</button>
          </div>
        </header>

        <div class="view-toolbar">
          <nav class="view-tabs" aria-label="Payload views">
            <button id="view-system" class="view-tab active" type="button" data-view="system" aria-selected="true">System</button>
            <button id="view-messages" class="view-tab" type="button" data-view="messages" aria-selected="false">Messages</button>
            <button id="view-tools" class="view-tab" type="button" data-view="tools" aria-selected="false">Tools</button>
            <button id="view-raw" class="view-tab" type="button" data-view="raw" aria-selected="false">Request JSON</button>
            <button id="view-output" class="view-tab" type="button" data-view="output" aria-selected="false">Output</button>
            <button id="view-delta" class="view-tab" type="button" data-view="delta" aria-selected="false">Delta</button>
            <button id="view-transport" class="view-tab" type="button" data-view="transport" aria-selected="false">Transport</button>
          </nav>
          <input id="panel-search" class="panel-search" type="search" placeholder="Search current view" />
          <span id="search-count" class="search-count">0/0</span>
          <button id="previous-match" class="nav-button" type="button" title="Previous match">‹</button>
          <button id="next-match" class="nav-button" type="button" title="Next match">›</button>
        </div>

        <section class="panel active" id="panel-system"></section>
        <section class="panel" id="panel-messages"></section>
        <section class="panel" id="panel-tools"></section>
        <section class="panel" id="panel-output"></section>
        <section class="panel" id="panel-delta"></section>
        <section class="panel" id="panel-transport"></section>
        <section class="panel" id="panel-raw"></section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
